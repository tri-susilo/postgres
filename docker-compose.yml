# ============================================================
# PostgreSQL 18.6 + pgBackRest -> backup ke Biznet Gio NEO Object Storage
#
# Endpoint NEO Object Storage : https://s3.neo.id  (path-style)
# Kredensial via file .env    : S3_ACCESS_KEY, S3_ACCESS_KEY_SECRET,
#                               S3_BUCKET, S3_ENDPOINT, S3_REGION
#   (copy .env.example -> .env dan isi sesuai console NEO)
# ============================================================

x-s3-env: &s3-env
  PGBACKREST_REPO1_S3_ENDPOINT: "${S3_ENDPOINT:-s3.neo.id}"
  PGBACKREST_REPO1_S3_BUCKET: "${S3_BUCKET:-pgbackup}"
  PGBACKREST_REPO1_S3_REGION: "${S3_REGION:-id-jakarta}"
  PGBACKREST_REPO1_S3_KEY: "${S3_ACCESS_KEY:-GANTI-ACCESS-KEY}"
  PGBACKREST_REPO1_S3_KEY_SECRET: "${S3_ACCESS_KEY_SECRET:-GANTI-SECRET-KEY}"
  # NEO pakai path-style (https://s3.neo.id/<bucket>/<path>)
  PGBACKREST_REPO1_S3_URI_STYLE: "${S3_URI_STYLE:-path}"
  # HTTPS production: enforce certificate verification
  # (nama opsi pgBackRest 2.60 = repo1-storage-verify-tls)
  PGBACKREST_REPO1_STORAGE_VERIFY_TLS: "${S3_TLS_VERIFY:-y}"

services:
  db:
    build: .
    image: postgres-pgbackrest:18.6
    restart: unless-stopped
    environment:
      TZ: "Asia/Jakarta"
      POSTGRES_PASSWORD: "admin123" # GANTI!
      POSTGRES_USER: postgres
      POSTGRES_DB: appdb
      # Cron backup otomatis (matikan: 0)
      PG_BACKUP_CRON: "1"
      PG_BACKUP_CRON_SCHEDULE: "0 2 * * *" # full backup harian jam 02:00
      <<: *s3-env # kredensial S3 (Biznet Gio)
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=main archive-push %p
    volumes:
      - db-data:/var/lib/postgresql
      - pgbackrest-log:/var/log/pgbackrest
      - pgbackrest-conf:/etc/pgbackrest
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Helper operasi repo-only (info). stanza-create / backup / restore
  # jalankan DI DALAM container db:
  #   docker compose exec -u postgres db pgbackrest --stanza=main stanza-create
  #   docker compose exec -u postgres db pgbackrest --stanza=main backup
  #   docker compose --profile backup run --rm pgbackrest
  pgbackrest:
    image: postgres-pgbackrest:18.6
    profiles: ["backup"]
    entrypoint: ["pgbackrest"]
    command: ["--stanza=main", "info"]
    user: postgres
    environment:
      <<: *s3-env
    volumes:
      - pgbackrest-log:/var/log/pgbackrest
      - pgbackrest-conf:/etc/pgbackrest

  # Helper restore (docker compose --profile restore run --rm restore)
  # Wajib: docker compose stop db dulu, supaya datadir tidak dipakai.
  pgbackrest-restore:
    image: postgres-pgbackrest:18.6
    profiles: ["restore"]
    entrypoint: ["pgbackrest"]
    command: ["--stanza=main", "--delta", "--set=latest", "restore"]
    user: postgres
    environment:
      <<: *s3-env
    volumes:
      - db-data:/var/lib/postgresql
      - pgbackrest-log:/var/log/pgbackrest
      - pgbackrest-conf:/etc/pgbackrest

volumes:
  db-data:
  pgbackrest-log:
  pgbackrest-conf:
