# ============================================================
# pgBackRest configuration - STANZA "main" dengan repo S3-compat
# Dokumentasi: https://pgbackrest.org/configuration.html
#
# Kredensial S3 TIDAK ditulis di file ini — dioverride via env:
#   PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET, dst.
# (lihat docker-compose.yml)
# ============================================================

[global]
# ---- Repo backup: S3-compatible (AWS S3 / MinIO / RVFS dsb.) ----
repo1-type=s3
# path di dalam bucket (mulai dari root bucket, WAJIB mulai dengan "/")
repo1-path=/pgbackrest

# ---- Endpoint & bucket (any object storage S3-compat) ----
#   AWS         : repo1-s3-endpoint=s3.<region>.amazonaws.com
#                 repo1-s3-bucket=<nama-bucket>, repo1-s3-region=<region>
#   MinIO lokal : endpoint=minio:9000, uri-style=path, tls-verify=n
# Nilai bawah ini ditimpa oleh env docker-compose (PGBACKREST_REPO1_S3_*)
# repo1-s3-endpoint=<isian via env>
# repo1-s3-bucket=<isian via env>
# repo1-s3-region=<isian via env>

# Opsi MinIO / storage on-prem pakai HTTP (self-signed tidak verify):
#   repo1-s3-uri-style=path
#   repo1-s3-tls-verify=n
# Untuk AWS asli gunakan uri-style=host dan tls-verify=y (default)

# ---- Kredensial (diisi via env, JANGAN di file ini) ----
# repo1-s3-key=<via env PGBACKREST_REPO1_S3_KEY>
# repo1-s3-key-secret=<via env PGBACKREST_REPO1_S3_KEY_SECRET>

# ---- Retensi ----
repo1-retention-full=2
repo1-retention-diff=4

# ---- Kompresi ----
compress-type=zst
compress-level=3

# ---- Logging ----
log-level-console=info
log-level-file=info
log-timestamp=y

# ---- Proses paralel & opsi backup ----
process-max=4
start-fast=y

# ============================================================
# Stanza "main" = cluster PostgreSQL yang dibackup
# pg1-path HARUS cocok dengan datadir postgres di container
# (postgres 18+ image: /var/lib/postgresql/<major>/<PGDATA name>)
# ============================================================
[main]
pg1-path=/var/lib/postgresql/18/docker
pg1-user=postgres
pg1-port=5432
