# ============================================================
# docker-compose.restore.yml  —  PROSES RESTORE (DR scenario)
#
# Alur:
#   1) `docker compose -f docker-compose.restore.yml down -v`   # reset volume
#   2) `docker compose -f docker-compose.restore.yml run --rm restore`  # restore dari S3
#      -> restore full/diff diff terbesar -> stop
#   3) `docker compose -f docker-compose.restore.yml up -d`     # start postgres
#
# Opsi restore (via .env / env saat run):
#   RESTORE_SET=20261108-150924F   # restore backup set tertentu (default latest)
#   RESTORE_TARGET="2026-11-08 14:00:00"  # point-in-time recovery (PITR)
#   RESTORE_TYPE=time             # tipe target (time/name/xid dst.)
#
# Catatan: file ini dipakai di HOST yang BARU (disaster/recovery host).
# Kredensial S3 dibaca dari .env yang sama dengan production.
# ============================================================

x-s3-env: &s3-env
  PGBACKREST_REPO1_S3_ENDPOINT: "${S3_ENDPOINT:-s3.neo.id}"
  PGBACKREST_REPO1_S3_BUCKET: "${S3_BUCKET:-pgbackup}"
  PGBACKREST_REPO1_S3_REGION: "${S3_REGION:-id-jakarta}"
  PGBACKREST_REPO1_S3_KEY: "${S3_ACCESS_KEY:-GANTI-ACCESS-KEY}"
  PGBACKREST_REPO1_S3_KEY_SECRET: "${S3_ACCESS_KEY_SECRET:-GANTI-SECRET-KEY}"
  PGBACKREST_REPO1_S3_URI_STYLE: "${S3_URI_STYLE:-path}"
  PGBACKREST_REPO1_STORAGE_VERIFY_TLS: "${S3_TLS_VERIFY:-y}"

services:
  # ---------- one-shot: restore ke volume kosong ----------
  restore:
    image: postgres-pgbackrest:18.6
    user: postgres
    entrypoint: ["/bin/bash", "-euc"]
    command:
      # Catatan: di compose, "$" pada skrip bash ditulis "$$" agar tidak
      # di-interpolate docker-compose.
      - |
        set -eu
        ARGS=(--stanza="$$PGBACKREST_STANZA" --delta)
        # pilih backup set tertentu bila di-specified
        if [ "$$RESTORE_SET" != "latest" ]; then
          ARGS+=(--set="$$RESTORE_SET")
        fi
        # Point-in-Time Recovery (PITR) bila RESTORE_TARGET diisi
        if [ -n "$$RESTORE_TARGET" ]; then
          ARGS+=(--type="$$RESTORE_TYPE"
                 --target="$$RESTORE_TARGET"
                 --target-action=promote)
        fi
        echo "pgbackrest restore $${ARGS[@]}"
        exec pgbackrest restore "$${ARGS[@]}"
    environment:
      PGBACKREST_STANZA: "main"
      RESTORE_SET: "latest"      # atau: RESTORE_SET=20261108-150924F
      RESTORE_TYPE: "time"       # hanya dipakai bila RESTORE_TARGET diisi
      RESTORE_TARGET: ""         # PITR: "2026-11-08 14:00:00"
      <<: *s3-env
    volumes:
      # volume FRESH (kosong). Down -v atau -p name beda agar tidak tabrak
      - restore-data:/var/lib/postgresql
      - restore-log:/var/log/pgbackrest
      - restore-conf:/etc/pgbackrest

  # ---------- postgres dari hasil restore ----------
  db:
    image: postgres-pgbackrest:18.6
    restart: unless-stopped
    depends_on:
      restore:
        condition: service_completed_successfully
    environment:
      POSTGRES_PASSWORD: "admin123"
      POSTGRES_USER: postgres
      POSTGRES_DB: appdb
      PG_BACKUP_CRON: "1"                    # aktifkan cron backup setelah restore
      PG_BACKUP_CRON_SCHEDULE: "0 2 * * *"
      <<: *s3-env
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=main archive-push %p
    volumes:
      - restore-data:/var/lib/postgresql
      - restore-log:/var/log/pgbackrest
      - restore-conf:/etc/pgbackrest
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  # helper: lihat daftar backup yang tersedia di S3
  info:
    image: postgres-pgbackrest:18.6
    profiles: ["info"]
    entrypoint: ["pgbackrest"]
    command: ["--stanza=main", "info"]
    user: postgres
    environment:
      <<: *s3-env
    volumes:
      - restore-conf:/etc/pgbackrest

volumes:
  restore-data:
  restore-log:
  restore-conf:
